<!doctype html>
<!--
=====================================================================
CONTENT ISSUES (những điểm cần giáo viên xem lại — không sửa âm thầm)
=====================================================================
1. "Thành phần tô màu" chỉ có S, AUX, V, O nhưng dữ liệu còn dùng B (If/if) và T (từ chỉ thời gian, tần suất).
   Trang thêm B = "Liên từ if" và T = "Thời gian / tần suất" vào chú thích màu.
2. "late" được gắn nhãn T (thời gian) ở Ví dụ 2 của Loại 1 ("[T: late {on Friday},]") và ở Câu A, Câu B phần so sánh.
   "late" là tính từ (bổ ngữ), không phải từ chỉ thời gian. Trang hiển thị "late" theo màu O (tân ngữ / bổ ngữ),
   còn "on Friday", "tomorrow" vẫn là T.
3. Phần COMPARE ghi "Loại 1: Zero Conditional | Câu điều kiện loại 0" và "Loại 2: First Conditional | Câu điều kiện loại 1".
   Số "Loại 1/Loại 2" trùng với tên loại câu điều kiện, dễ gây nhầm. Trang chỉ ghi "Câu điều kiện loại 0" và "Câu điều kiện loại 1".
4. Ghi chú phần REVIEW yêu cầu viết dạng đầy đủ, không viết tắt, và ví dụ có "has..." (has không có dạng viết tắt liên quan).
   Theo yêu cầu của prompt (5.4), trang vẫn chấp nhận dạng viết tắt đúng (won't visit, doesn't…) và dấu nháy cong (’).
5. Nhân vật chính theo cài đặt là Nam, nhưng nội dung gốc dùng nhiều tên (Tom, Hoa, Linh, Lan, Sara, Anna, Jack, Mia, Ha, Sophie, Ms Lan).
   Giữ nguyên các câu gốc; câu do AI thêm dùng Nam (he/his/him).
6. "Dấu hiệu nhận biết" của Loại 0 có cả mô tả (a fact, a rule, a habit, V(s/es) in both parts, no future time word),
   không phải từ xuất hiện trong câu. Trang tách thành hai nhóm: từ trong câu (always, every time…) và gợi ý (sự thật, quy tắc, thói quen…).
7. Phần Cách dùng của Loại 1 có ý 3 (can / might thay cho will), nhưng không có ví dụ hay bài tập nào. Trang giữ ý này nhưng không kiểm tra.
8. Danh sách từ vựng (Section 4) để trống. Trang dùng 10 từ trong bài + 31 từ, cụm động từ và collocation về du lịch và giao thông (A1–B1)
   do AI thêm theo yêu cầu, có cả "museum" (xuất hiện trong ví dụ gốc nhưng chưa có trong danh sách). IPA theo giọng Anh – Anh.
9. Ví dụ, câu đố "Đoán", các khung câu biến đổi, câu phân loại ở phần So sánh, 2 câu trắc nghiệm thêm ở Ôn tập,
   câu ví dụ cho từng từ vựng, và lời giải thích cho từng phương án sai là nội dung mới do AI viết theo đúng quy tắc của bài.
=====================================================================
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Câu điều kiện A · Real Conditionals</title>
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--ink:#1b2333;--mut:#5a6476;--line:#dce2ee;--soft:#eef2f9;
  --acc:#2f56c9;--accInk:#fff;--ok:#157a3c;--okbg:#e5f5ea;--bad:#b9381a;--badbg:#fdece7;
  --S:#1d4ed8;--AUX:#c2410c;--V:#15803d;--O:#7e22ce;--B:#be185d;--T:#475569;
  --hlL:84%;--ptL:30%;--hlS:75%;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
  --scale:1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e131c;--card:#171f2d;--ink:#e7ebf3;--mut:#9ca7ba;--line:#2a3447;--soft:#1f2939;
  --acc:#7c9cff;--accInk:#0e131c;--ok:#4ade80;--okbg:#123222;--bad:#ff8a6b;--badbg:#3a1d16;
  --S:#80a8ff;--AUX:#fb923c;--V:#4ade80;--O:#c99bff;--B:#f472b6;--T:#a9b6ca;
  --hlL:30%;--ptL:70%;--hlS:45%;--shadow:none;color-scheme:dark;}}
:root[data-theme=dark]{
  --bg:#0e131c;--card:#171f2d;--ink:#e7ebf3;--mut:#9ca7ba;--line:#2a3447;--soft:#1f2939;
  --acc:#7c9cff;--accInk:#0e131c;--ok:#4ade80;--okbg:#123222;--bad:#ff8a6b;--badbg:#3a1d16;
  --S:#80a8ff;--AUX:#fb923c;--V:#4ade80;--O:#c99bff;--B:#f472b6;--T:#a9b6ca;
  --hlL:30%;--ptL:70%;--hlS:45%;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html{font-size:calc(clamp(17px, 15.6px + .3vw, 20px) * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;height:100dvh;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column}
/* header */
#hdr{flex:none;display:flex;align-items:center;gap:.4rem;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);position:relative;min-height:52px}
.ib{min-width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;padding:0 .5rem}
.htitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.htitle b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.htitle span{font-size:.78rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hTime{font-size:.78rem;color:var(--mut);white-space:nowrap}
#prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}
#prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s ease}
/* main */
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;outline:none}
.screen{max-width:1180px;margin:0 auto;padding:14px 16px 28px;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.trow{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.6rem;margin-bottom:.6rem}
.trow>div:first-child{flex:1 1 210px;min-width:0}
.trow .mini{margin-left:auto}
.kick{margin:0;font-size:.8rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
h1{font-size:1.45rem;line-height:1.25;margin:.1rem 0 0}
h2{font-size:1.15rem;margin:0 0 .5rem}
h3{font-size:1.02rem;margin:0 0 .45rem}
p{margin:.35rem 0}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px;margin:0 0 12px;box-shadow:var(--shadow);min-width:0}
.cols{display:block}
@media (min-width:1024px){
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .cols>.col{min-width:0}
  .screen{padding:18px 28px 32px}
}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:.05rem .45rem;border-radius:99px;background:var(--soft);color:var(--mut);vertical-align:middle}
.new{background:#fde68a;color:#7c4a03}
/* nav */
#nav{flex:none;display:flex;gap:10px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
#nav button{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:1rem}
#nav .pri,.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
#nav button:disabled{opacity:.4}
@media (min-width:1024px){#nav{justify-content:space-between}#nav button{flex:0 0 220px}}
@media (max-height:480px) and (orientation:landscape){
  #hdr{min-height:44px;padding:3px 10px}.ib{height:38px;min-width:40px}
  #nav{padding:5px 12px}#nav button{min-height:40px}
  h1{font-size:1.2rem}
}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:46px;padding:.45rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* sentences */
.en{font-family:inherit}
.sent{font-size:1.22rem;line-height:1.75;margin:.1rem 0}
.ck{display:inline-block;margin:0 .28em .1em 0;font-weight:650;white-space:normal}
.r-S{color:var(--S)}.r-AUX{color:var(--AUX)}.r-V{color:var(--V)}.r-O{color:var(--O)}.r-B{color:var(--B)}
.r-T{color:var(--T);text-decoration:underline dashed 1.5px;text-underline-offset:4px}
.r-X{color:var(--bad);text-decoration:line-through wavy 2px}
mark.hl{background:hsl(var(--h) var(--hlS) var(--hlL));color:inherit;border-radius:.3em;padding:0 .12em;box-shadow:inset 0 -2px 0 hsl(var(--h) 60% 45%)}
mark.sig{background:transparent;color:inherit;outline:2px solid hsl(var(--h) 55% 50%);outline-offset:1px;border-radius:.3em;padding:0 .1em}
.vw{text-decoration:underline dotted 2px;text-underline-offset:5px;cursor:pointer;border-radius:4px}
.vw:hover{background:var(--soft)}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--mut);margin:0 .15em}
.sc{border-left:4px solid hsl(var(--h,220) 55% 55%);padding:.25rem 0 .35rem .75rem;margin:.6rem 0}
.scb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:.15rem}
.spk{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:1rem}
.spk.on{background:var(--acc);color:var(--accInk)}
.vbtn{min-height:40px;border-radius:10px;border:1px dashed var(--line);background:transparent;padding:0 .8rem;font-size:.9rem;color:var(--mut)}
.vi{background:var(--soft);border-radius:10px;padding:.35rem .6rem;margin:.35rem 0 0;font-size:.95rem;width:100%}
/* legend */
details.leg{margin:0 0 .6rem}
details.leg summary{cursor:pointer;font-size:.88rem;color:var(--mut);min-height:40px;display:flex;align-items:center;gap:.4rem;list-style:none}
details.leg summary::-webkit-details-marker{display:none}
details.leg summary::before{content:"▸";transition:transform .2s}
details.leg[open] summary::before{transform:rotate(90deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:.25rem;border:1.5px solid currentColor;border-radius:99px;padding:.05rem .55rem;font-size:.85rem;font-weight:650;background:var(--card)}
.legx{font-size:.88rem;color:var(--mut);margin:.4rem 0 0}
/* mini map */
.mini{flex:none;display:grid;gap:3px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:.62rem;line-height:1.2}
.mrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:3px;opacity:.38;transition:opacity .3s}
.mrow.on{opacity:1}
.mlab{font-weight:700;color:hsl(var(--h) 60% var(--ptL));padding:2px 3px;white-space:nowrap}
.mcell{background:hsl(var(--h) var(--hlS) var(--hlL));border-radius:4px;padding:2px 4px;text-align:center;white-space:nowrap;font-weight:600}
.mrow.on .mcell{box-shadow:inset 0 0 0 1.5px hsl(var(--h) 60% 45%)}
/* formula */
.fm{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:.3rem 0 .6rem}
.fm .fl{width:100%;font-size:.82rem;color:var(--mut);font-weight:600}
.fc{border-radius:8px;padding:.1rem .45rem;font-weight:700;font-size:.95rem;border:1.5px solid var(--line);background:var(--card)}
.fc.S{color:var(--S);border-color:var(--S)}.fc.V{color:var(--V);border-color:var(--V)}.fc.AUX{color:var(--AUX);border-color:var(--AUX)}.fc.B{color:var(--B);border-color:var(--B)}
.fp{color:var(--mut);font-weight:700}
.fcm{font-weight:900;font-size:1.1rem;padding:0 .1rem}
/* clause diagram */
.cl{display:flex;flex-direction:column;gap:6px;align-items:stretch;margin:.4rem 0}
.clb{border-radius:12px;padding:.5rem .7rem;border:2px solid hsl(var(--h) 55% 50%);background:hsl(var(--h) var(--hlS) var(--hlL) / .45)}
.clb small{display:block;color:var(--mut);font-weight:600;font-size:.78rem}
.clb b{font-size:1.05rem}
.cla{text-align:center;font-size:1.3rem;color:var(--mut);line-height:1}
@media (min-width:560px){.cl{flex-direction:row;align-items:center}.clb{flex:1}.cla{transform:none}}
/* timeline */
.tl{width:100%;height:auto;display:block;margin:.2rem 0}
.tl text{font-family:inherit;fill:var(--mut);font-weight:700}
.tl .ax{stroke:var(--mut);stroke-width:2.5}
/* lists */
ul.clean{margin:.3rem 0;padding-left:1.2rem}
ul.clean li{margin:.25rem 0}
.gold{border-radius:12px;padding:.6rem .75rem;background:hsl(var(--h) var(--hlS) var(--hlL) / .5);border:1px solid hsl(var(--h) 55% 55%)}
/* options / quiz */
.opt{display:flex;align-items:flex-start;gap:.6rem;width:100%;text-align:left;min-height:50px;padding:.6rem .75rem;margin:.4rem 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.05rem;transition:transform .15s,border-color .2s,background .2s}
.opt .lt{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.ok .lt::before{content:"✓"}.opt.no .lt::before{content:"✗"}
.opt.ok .lt,.opt.no .lt{font-size:0}
.opt.ok .lt::before,.opt.no .lt::before{font-size:.95rem}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.6}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.3rem}
.qdots{display:flex;flex-wrap:wrap;gap:6px}
.qd{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:.75rem;font-weight:700;padding:0}
.qd.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.qd.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.qd.cur{outline:2.5px solid var(--acc);outline-offset:1px}
.qstem{font-size:1.18rem;line-height:1.7;margin:.3rem 0 .5rem}
.fb{border-radius:12px;padding:.6rem .75rem;margin:.5rem 0;animation:enter .3s ease both}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb b.h{display:block;margin-bottom:.2rem}
.fb em{font-style:normal;font-weight:700}
.qnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:.6rem}
.qnav .btn{flex:1;min-width:130px}
.gin{width:100%;min-height:50px;font-size:1.05rem;padding:.5rem .7rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.gin.ok{border-color:var(--ok)}.gin.no{border-color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.qsum{border-radius:12px;padding:.7rem;background:var(--soft);margin-top:.6rem}
/* spot mistake */
.tok{display:inline-block;min-height:42px;padding:.2rem .45rem;margin:.15rem .1rem;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:1.12rem}
.tok.hit{border-color:var(--bad);background:var(--badbg);color:var(--bad);text-decoration:line-through}
.tok.miss{animation:shake .35s;border-color:var(--mut)}
.fix{color:var(--ok);font-weight:700}
/* stage */
.stage{position:relative;min-height:6.5rem;padding:.8rem .6rem;border-radius:14px;background:var(--soft);font-size:1.25rem;line-height:1.9;display:flex;flex-wrap:wrap;align-content:center}
.stage .ck{margin:.1rem .32em .1rem 0;padding:.05rem .15rem;border-radius:6px}
.stage .ck.chg{animation:flash 1s ease}
@keyframes flash{0%{background:hsl(50 100% 60% / .9)}100%{background:transparent}}
.cap{min-height:3rem;margin:.6rem 0;font-weight:600}
.frd{display:flex;gap:6px;justify-content:center;margin:.3rem 0}
.frd i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.frd i.on{background:var(--acc)}
/* decision path */
.dq{border-radius:14px;border:1.5px solid var(--line);padding:.7rem;margin:.5rem 0;animation:enter .3s both}
.dres{border-radius:14px;padding:.7rem;border:2px solid hsl(var(--h) 55% 50%);background:hsl(var(--h) var(--hlS) var(--hlL) / .55);margin:.5rem 0;animation:pop .45s}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:.3rem 0 .6rem}
.tab{min-height:44px;padding:.3rem .9rem;border-radius:99px;border:1.5px solid hsl(var(--h) 55% 50%);background:var(--card);font-weight:650}
.tab.on{background:hsl(var(--h) var(--hlS) var(--hlL));}
/* big picture grid */
.bp{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch;margin:.4rem 0}
.bp .h{font-size:.8rem;color:var(--mut);font-weight:700;align-self:end;text-align:center}
.bp .rl{font-weight:800;color:hsl(var(--h) 60% var(--ptL));display:flex;align-items:center;padding-right:.3rem;font-size:.95rem}
.bp .c{border-radius:10px;padding:.45rem .3rem;text-align:center;font-weight:700;background:hsl(var(--h) var(--hlS) var(--hlL));border:1.5px solid hsl(var(--h) 55% 50%);font-size:.98rem}
/* vocab */
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{min-height:42px;border-radius:99px;border:1.5px dotted var(--mut);background:var(--card);padding:.2rem .8rem;font-weight:600}
.fcard{perspective:1200px;margin:.4rem 0}
.fin{position:relative;min-height:15rem;transition:transform .5s;transform-style:preserve-3d}
.fcard.flip .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1.5px solid var(--line);background:var(--card);padding:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.fw{font-size:1.7rem;font-weight:800;line-height:1.2}
.fpos{color:var(--mut);font-style:italic}
.fipa{color:var(--mut);margin:.2rem 0}
.fvi{font-size:1.35rem;font-weight:700;margin-bottom:.4rem}
.kn{color:var(--ok);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
/* result */
.rc{max-width:520px;margin:0 auto}
.rt{width:100%;border-collapse:collapse;font-size:.92rem}
.rt td{padding:.3rem .2rem;border-bottom:1px solid var(--line)}
.rt td:last-child{text-align:right;font-weight:700;white-space:nowrap}
textarea{width:100%;min-height:5.5rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:.5rem .6rem;font-size:1rem}
.fld{display:block;font-size:.9rem;font-weight:600;margin:.6rem 0}
.fld input{display:block;width:100%;margin-top:.3rem;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:.4rem .7rem;font-size:1.05rem}
/* cheat sheet */
.cs-f{font-size:.95rem}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex}
.ov[hidden]{display:none}
.drawer{background:var(--card);width:min(86vw,360px);height:100%;overflow:auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));animation:slide .25s ease}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
.dg{font-size:.75rem;color:var(--mut);font-weight:700;text-transform:uppercase;margin:.8rem 0 .2rem}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:40;background:#1b2333;color:#fff;border-radius:12px;padding:.55rem .9rem;font-size:.9rem;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .3s}

.err{border:2px solid var(--bad);background:var(--badbg);border-radius:14px;padding:1rem;margin:1rem}
.confetti{position:fixed;pointer-events:none;z-index:50;font-size:1.4rem;animation:fly 1s ease-out forwards}

}

function parseChunks(str) {
  const keep = [];
  const s = String(str).replace(/\[\[([^\]]+)\]\]/g, (m, x) => { keep.push(x); return "\u0001" + (keep.length - 1) + "\u0002"; });
  const out = []; const re = /\[([A-Z]+)(?:#(\w+))?:\s*([^\]]*)\]/g; let m;
  while ((m = re.exec(s))) out.push({ role: m[1], key: m[2] || "", text: m[3].replace(/\u0001(\d+)\u0002/g, (a, n) => "[[" + keep[+n] + "]]").trim() });
  if (!out.length) out.push({ role: "", key: "", text: String(str) });
  const last = out[out.length - 1]; if (!/[.?!]$/.test(last.text)) last.text += ".";
  return out;
}
function autolink(text) {
  const hits = [];
  VX.forEach(x => { x.re.lastIndex = 0; let m; while ((m = x.re.exec(text))) { if (!m[0]) { x.re.lastIndex++; continue; } hits.push({ s: m.index, e: m.index + m[0].length, i: x.i }); } });
  hits.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  let out = "", pos = 0;
  for (const h of hits) { if (h.s < pos) continue; out += esc(text.slice(pos, h.s)) + `<span class="vw" role="button" tabindex="0" data-v="${h.i}">${esc(text.slice(h.s, h.e))}</span>`; pos = h.e; }
  return out + esc(text.slice(pos));
}
/* rich: {x} = dạng cần học, {{id|x}} = theo màu điểm id, [[x|từ]] = từ vựng */
function rich(text, pt, role, link = true) {
  const parts = String(text).split(/(\{\{[^}]+\}\}|\{[^}]+\}|\[\[[^\]]+\]\])/);
  return parts.map(p => {
    let m;
    if ((m = p.match(/^\{\{([^|}]+)\|([^}]+)\}\}$/))) return `<mark class="hl" style="--h:${(PT[m[1]] || {}).hue || 220}">${link ? autolink(m[2]) : esc(m[2])}</mark>`;
    if ((m = p.match(/^\{([^}]+)\}$/))) return `<mark class="${role === "T" ? "sig" : "hl"}" style="--h:${pt ? pt.hue : 220}">${link ? autolink(m[1]) : esc(m[1])}</mark>`;
    if ((m = p.match(/^\[\[([^|\]]+)\|([^\]]+)\]\]$/))) { const i = L.vocab.findIndex(v => v.w === m[2]); return `<span class="vw" role="button" tabindex="0" data-v="${i}">${esc(m[1])}</span>`; }
    return link ? autolink(p) : esc(p);
  }).join("");
}
function sent(str, pt, link = true) { return parseChunks(str).map(c => `<span class="ck r-${c.role}"${c.key ? ` data-k="${c.key}"` : ""}>${rich(c.text, pt, c.role, link)}</span>`).join(""); }
const plainText = s => String(s).replace(/\{\{[^|}]+\|([^}]+)\}\}/g, "$1").replace(/[{}]/g, "").replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g, "$1").replace(/\*/g, "");
function plainS(str) { return parseChunks(str).filter(c => c.role !== "X").map(c => plainText(c.text)).join(" "); }
function stem(q) { return autolink(q).replace(/_{3,}/g, '<span class="blank" aria-label="chỗ trống"></span>'); }

  g += `<text x="240" y="${y - 14}" font-size="26" text-anchor="middle" style="fill:#e0a400">★</text><line x1="240" y1="${y - 8}" x2="240" y2="${y + 10}" stroke="#e0a400" stroke-width="2.5"/>`;
  if (p.id === "z") {

const symLegend = `<p class="legx">★ = hiện tại (bây giờ) · ● = việc xảy ra, lặp lại · ○ = việc có thể xảy ra, chưa xảy ra</p>`;

function formula(f) {
  const toks = f.split(/(\s*\+\s*|,\s*|\?)/).filter(t => t && t.trim() !== "");
  return toks.map(t => {
    const x = t.trim();
    if (x === "+") return `<span class="fp">+</span>`;
    if (x === ",") return `<span class="fcm">,</span>`;
    if (x === "?") return `<span class="fcm">?</span>`;
    let c = "";
    if (/^if$/i.test(x)) c = "B"; else if (x === "S") c = "S";
    else if (/^(will|do\/does|Do\/Does|Will|not|do|does)$/.test(x)) c = "AUX";
    else if (/V/.test(x)) c = "V";
    return `<span class="fc ${c}">${esc(x)}</span>`;
  }).join("");
}
function clause(p) {
  return `<div class="cl" style="--h:${p.hue}"><div class="clb"><small>Vế if (điều kiện)</small><b><span class="r-B">If</span> + S + <span class="r-V">${esc(p.clause[0])}</span></b></div><div class="cla" aria-hidden="true">➜</div><div class="clb"><small>Vế chính (kết quả)</small><b>S + <span class="r-V">${esc(p.clause[1])}</span></b></div></div>`;
}

const SS = window.speechSynthesis || null; let voices = [], speakBtn = null, warned = false;
function loadVoices() { try { voices = SS ? SS.getVoices() : []; } catch (e) { voices = []; } }
if (SS) { loadVoices(); try { SS.onvoiceschanged = loadVoices; } catch (e) {} }
function stopSay() { try { SS && SS.cancel(); } catch (e) {} if (speakBtn) { speakBtn.classList.remove("on"); speakBtn.textContent = speakBtn.dataset.ico || "🔊"; } speakBtn = null; }
function say(text, btn) {
  if (!SS || typeof SpeechSynthesisUtterance === "undefined") { if (!warned) { toast("Trình duyệt này chưa đọc được tiếng Anh. Hãy thử Chrome hoặc Safari."); warned = true; } return; }
  if (btn && speakBtn === btn) { stopSay(); return; }
  stopSay();
  const u = new SpeechSynthesisUtterance(text); u.lang = st.set.voice; u.rate = st.set.rate;
  const v = voices.find(v => v.lang.replace("_", "-") === st.set.voice) || voices.find(v => /^en/i.test(v.lang));
  if (v) u.voice = v; else if (!warned && voices.length) { toast("Máy bạn chưa có giọng đọc tiếng Anh. Bạn có thể cài thêm trong phần cài đặt giọng nói của máy."); warned = true; }
  if (btn) { btn.dataset.ico = btn.textContent; btn.textContent = "⏹"; btn.classList.add("on"); speakBtn = btn; }
  const end = () => { if (speakBtn === btn) { if (btn) { btn.classList.remove("on"); btn.textContent = btn.dataset.ico || "🔊"; } speakBtn = null; } };
  u.onend = end; u.onerror = end;
  try { SS.speak(u); } catch (e) { end(); }
}

let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 4200); }
function cheer(el) {
  if (RM || !el) return; const r = el.getBoundingClientRect();
  ["🎉", "⭐", "✨", "🎊", "⭐"].forEach((e, i) => { const s = document.createElement("span"); s.className = "confetti"; s.textContent = e; s.style.left = (r.left + r.width / 2) + "px"; s.style.top = (r.top + 10) + "px"; s.style.setProperty("--dx", (Math.cos(i * 1.3) * 90) + "px"); s.style.setProperty("--dy", (-60 - i * 18) + "px"); document.body.appendChild(s); setTimeout(() => s.remove(), 1100); });
}

/* ---------- Bộ câu hỏi (trắc nghiệm + gõ đáp án) ---------- */
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!]+$/, "");
function variants(list) {
  const out = new Set(); list.forEach(a => { const n = norm(a); out.add(n);
    [["will not", "won't"], ["do not", "don't"], ["does not", "doesn't"], ["is not", "isn't"], ["are not", "aren't"]].forEach(([f, c]) => { if (n.includes(f)) out.add(n.replace(f, c)); if (n.includes(c)) out.add(n.replace(c, f)); }); });
  return out;
}
const QUIZ = {};
function quizItems(key) {
  if (key.startsWith("p-")) return PT[key.slice(2)].questions.map(q => Object.assign({ type: "mc" }, q));
  if (key === "rev") return L.review.items;
  if (key === "sort") return L.compare.sort.map(s => ({ type: "mc", q: s.q, opts: ["Câu điều kiện loại 0", "Câu điều kiện loại 1"], a: s.a, ex: s.ex, fixed: true, why: {} }));
  if (key === "voc") return L.vocab.map((v, i) => {
    const r = rng(i * 31 + 7); const others = shuffle(L.vocab.filter((x, j) => j !== i), r).slice(0, 3).map(x => x.vi);
    return { type: "mc", q: v.w, voc: i, opts: [v.vi, ...others], a: 0, ex: `*${v.w}* (${v.pos}) = ${v.vi}. Ví dụ: ${v.ex}`, why: {} };
  });
  return [];
}
function qState(key) { st.ans[key] = st.ans[key] || []; return st.ans[key]; }
function score(key) { const n = quizItems(key).length, a = qState(key); let c = 0, d = 0; for (let i = 0; i < n; i++) if (a[i] && a[i].f !== undefined) { d++; if (a[i].f) c++; } return { c, d, n }; }
function order(key, i, n, fixed) { const k = key + "_" + i; if (!st.ord[k] || st.ord[k].length !== n) st.ord[k] = fixed ? [...Array(n).keys()] : shuffle([...Array(n).keys()]); return st.ord[k]; }
function quizBox(key) { return `<div class="quiz" data-key="${key}"></div>`; }
function renderQuiz(box) {
  const key = box.dataset.key, items = quizItems(key), A = qState(key);
  let i = st.qi[key] || 0; if (i >= items.length) i = 0; st.qi[key] = i;
  const it = items[i], s = A[i] || {};
  const dots = items.map((q, j) => { const a = A[j]; const c = a && a.f !== undefined ? (a.f ? "ok" : "no") : ""; return `<button class="qd ${c} ${j === i ? "cur" : ""}" data-qj="${j}" aria-label="Câu ${j + 1}${c === "ok" ? ", đúng" : c === "no" ? ", sai" : ""}">${j + 1}</button>`; }).join("");
  let body = "";
  const isVoc = it.voc !== undefined, hide = isVoc && st.listen && s.c === undefined;
  if (isVoc) body += `<p class="qstem en"><b>${hide ? "🎧 Nghe và chọn nghĩa đúng" : esc(it.q)}</b> ${hide ? "" : `<span class="mut">(${esc(L.vocab[it.voc].pos)}) ${esc(L.vocab[it.voc].ipa)}</span>`} ${spk(it.q)}</p>`;
  else body += `<p class="qstem en">${stem(it.q)}</p>`;
  if (it.type === "gap") {
    body += `<input class="gin ${s.ok === true ? "ok" : s.ok === false ? "no" : ""}" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án…" aria-label="Đáp án câu ${i + 1}" value="${esc(s.c || "")}" ${s.ok !== undefined ? "readonly" : ""}>`;
    if (s.ok === undefined) body += `<div class="qnav"><button class="btn pri" data-qchk>Kiểm tra ✓</button></div>`;
  } else {
    const ord = order(key, i, it.opts.length, it.fixed);
    body += ord.map((oi, k) => {
      let cls = ""; if (s.c !== undefined) { if (oi === it.a) cls = "ok"; else if (oi === s.c) cls = "no"; else cls = "dim"; }
      return `<button class="opt en ${cls}" data-qo="${oi}" ${s.c !== undefined ? "disabled" : ""}><span class="lt">${"ABCD"[k]}</span><span>${esc(it.opts[oi])}</span></button>`;
    }).join("");
  }
  if (s.ok !== undefined) {
    const right = it.type === "gap" ? it.ans[0] : it.opts[it.a];
    if (s.ok) body += `<div class="fb ok" role="status"><b class="h">✓ Chính xác!</b>${md(it.ex)}</div>`;
    else body += `<div class="fb no" role="status"><b class="h">✗ Chưa đúng.</b>${it.type !== "gap" && it.why && it.why[s.c] ? `<p>${md(it.why[s.c])}</p>` : ""}<p>Đáp án đúng: <em class="en">${esc(right)}</em></p><p>${md(it.ex)}</p></div>`;
  }
  const done = items.every((q, j) => A[j] && A[j].f !== undefined);
  let navh = `<div class="qnav">`;
  if (i > 0) navh += `<button class="btn" data-qj="${i - 1}">← Câu trước</button>`;
  if (s.ok === false) navh += `<button class="btn" data-qre>↻ Thử lại câu này</button>`;
  if (i < items.length - 1) navh += `<button class="btn ${s.ok !== undefined ? "pri" : ""}" data-qj="${i + 1}">Câu tiếp →</button>`;
  navh += `</div>`;
  let sum = "";
  if (done) { const sc = score(key); const wrong = A.filter(a => a && a.f === false).length; sum = `<div class="qsum"><b>Đã làm xong: ${sc.c} / ${sc.n} câu đúng ở lần đầu.</b> ${sc.c === sc.n ? "🎉 Tuyệt vời!" : ""}${wrong ? `<div class="qnav"><button class="btn" data-qwrong>↻ Làm lại các câu sai</button></div>` : ""}<p class="mut" style="font-size:.88rem">Điểm chỉ tính lần làm đầu tiên. Bấm “Tiếp →” để sang bước sau.</p></div>`; }
  const many = items.length > 12; const scN = score(key);
  const head = many ? `<div style="flex:1;min-width:160px"><div class="bar"><i style="width:${scN.d / scN.n * 100}%"></i></div><span class="mut" style="font-size:.8rem">Đã làm ${scN.d}/${scN.n} · đúng ${scN.c}</span></div>` : `<div class="qdots" role="group" aria-label="Các câu hỏi">${dots}</div>`;
  box.innerHTML = `<div class="card q"><div class="qhead">${head}<span class="mut" style="font-size:.85rem">Câu ${i + 1}/${items.length}</span></div>${body}${navh}</div>${sum}`;
  const inp = $(".gin", box); if (inp && s.ok === undefined) inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkGap(box); } });
}
function answer(box, oi) {
  const key = box.dataset.key, items = quizItems(key), A = qState(key), i = st.qi[key] || 0, it = items[i];
  const ok = oi === it.a; const s = A[i] || {}; if (s.f === undefined) s.f = ok; s.c = oi; s.ok = ok; A[i] = s; save(); renderQuiz(box); afterAns(box, ok);
}
function checkGap(box) {

  const inp = $(".gin", box); const v = inp.value; if (!v.trim()) { inp.classList.add("shake"); setTimeout(() => inp.classList.remove("shake"), 400); return; }

let AN = null;
function morph(stage, str, pt, quiet) {
  const old = new Map(); $$(".ck", stage).forEach(e => old.set(e.dataset.k, { r: e.getBoundingClientRect(), html: e.innerHTML, el: e }));
  const sr0 = stage.getBoundingClientRect();
  stage.innerHTML = sent(str, pt, false);

  const sr = stage.getBoundingClientRect();
  $$(".ck", stage).forEach(e => {
    const o = old.get(e.dataset.k); const r = e.getBoundingClientRect();
    if (o) { const dx = o.r.left - r.left, dy = o.r.top - r.top; if (dx || dy) e.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: "none" }], { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)" }); if (o.html !== e.innerHTML) e.classList.add("chg"); old.delete(e.dataset.k); }
    else e.animate([{ opacity: 0, transform: "translateY(-14px) scale(.9)" }, { opacity: 1, transform: "none" }], { duration: 500, delay: 200, easing: "ease-out", fill: "backwards" });
  });
  old.forEach(o => { const c = o.el.cloneNode(true); c.style.position = "absolute"; c.style.left = (o.r.left - sr.left) + "px"; c.style.top = (o.r.top - sr.top) + "px"; c.style.margin = 0; stage.appendChild(c); const a = c.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(14px)" }], { duration: 400, fill: "forwards" }); a.onfinish = () => c.remove(); });
}
function animStart(p) { AN = { p, i: 0, tm: null }; animShow(true); }
function animShow(quiet) {
  if (!AN) return; const f = AN.p.frames[AN.i]; const stage = $("#stage"); if (!stage) return;

}
function animStep(d) { if (!AN) return; const n = AN.p.frames.length; AN.i = Math.max(0, Math.min(n - 1, AN.i + d)); animShow(); }
function animPlay() {
  if (!AN) return; const b = $("#anPlay");
  if (AN.tm) { clearInterval(AN.tm); AN.tm = null; if (b) b.textContent = "▶ Phát"; return; }
  if (AN.i >= AN.p.frames.length - 1) { AN.i = 0; animShow(); }
  if (b) b.textContent = "⏸ Dừng";
  AN.tm = setInterval(() => { if (AN.i >= AN.p.frames.length - 1) { animPlay(); return; } animStep(1); }, 2800);
}

function openMenu() {
  let h = `<div class="row" style="justify-content:space-between"><b>Các bước</b><button class="ib" data-close aria-label="Đóng">✕</button></div>`, g = "";
  SCR.forEach((s, i) => { if (s.grp !== g) { g = s.grp; h += `<p class="dg">${esc(g)}</p>`; } h += `<button class="di ${i === st.scr ? "cur" : ""}" data-go="${i}"><span class="ck2">${stepDone(s) ? "✔" : ""}</span>${esc(s.t)}</button>`; });
  $("#drawer").innerHTML = h; $("#ovMenu").hidden = false; const c = $(".di.cur", $("#drawer")); if (c) c.scrollIntoView({ block: "center" });
}
function applySet() {
  document.documentElement.style.setProperty("--scale", st.set.scale);
  if (st.set.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", st.set.theme);
}
function openSet() {
  const S = st.set;
  $("#setp").innerHTML = `<div class="row" style="justify-content:space-between"><b>⚙︎ Cài đặt</b><button class="ib" data-close aria-label="Đóng">✕</button></div>
    <label>Cỡ chữ</label><div class="seg"><button data-set="scale-">A−</button><button disabled>${Math.round(S.scale * 100)}%</button><button data-set="scale+">A+</button></div>
    <label>Giao diện</label><div class="seg">${[["auto", "Tự động"], ["light", "Sáng"], ["dark", "Tối"]].map(([k, t]) => `<button class="${S.theme === k ? "on" : ""}" data-set="theme:${k}">${t}</button>`).join("")}</div>
    <label for="sv">Giọng đọc</label><select id="sv"><option value="en-GB" ${S.voice === "en-GB" ? "selected" : ""}>🇬🇧 Giọng Anh</option><option value="en-US" ${S.voice === "en-US" ? "selected" : ""}>🇺🇸 Giọng Mỹ</option></select>
    <label>Tốc độ đọc</label><div class="seg"><button class="${S.rate === 1 ? "on" : ""}" data-set="rate:1">Thường</button><button class="${S.rate !== 1 ? "on" : ""}" data-set="rate:0.7">Chậm</button></div>
    <label>Tiến độ</label><button class="btn wide" data-set="reset">↺ Học lại từ đầu (xóa điểm)</button>`;
  $("#sv").onchange = e => { st.set.voice = e.target.value; save(); };
  $("#ovSet").hidden = false;
}
$("#bMenu").onclick = openMenu; $("#bSet").onclick = openSet;

/* ---------- Bảng nghĩa từ vựng ---------- */
function openSheet(i) {
  const v = L.vocab[i]; if (!v) return; const sh = $("#sheet");
  sh.innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-start"><div><b class="en" style="font-size:1.25rem">${esc(v.w)}</b> <i class="mut">${esc(v.pos)}</i> <span class="mut">${esc(v.ipa)}</span></div><button class="ib" data-close aria-label="Đóng">✕</button></div>
    <p style="font-size:1.1rem;font-weight:700;margin:.2rem 0">${esc(v.vi)} ${spk(v.w)}</p><p class="en mut" style="margin:.3rem 0">${esc(v.ex)} ${spk(v.ex)}</p>`;
  sh.hidden = false;
}
function closeSheet() { $("#sheet").hidden = true; }

/* ---------- Xử lý chạm / bấm ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-v],[role=button]");
  if (!$("#sheet").hidden && !e.target.closest("#sheet") && !(t && t.dataset.v !== undefined)) closeSheet();
  if (!t) { if (e.target.classList && e.target.classList.contains("ov")) e.target.hidden = true; return; }
  const d = t.dataset;
  if (d.close !== undefined) { const ov = t.closest(".ov"); if (ov) ov.hidden = true; else closeSheet(); return; }
  if (d.say !== undefined) { say(d.say, t); return; }
  if (d.v !== undefined) { openSheet(+d.v); return; }
  if (d.go !== undefined) { $("#ovMenu").hidden = true; go(+d.go); return; }
  if (d.next !== undefined) { next(); return; }
  if (d.vi !== undefined) { const p = t.parentElement.querySelector(".vi"); p.hidden = !p.hidden; t.textContent = p.hidden ? "👁 Xem nghĩa" : "🙈 Ẩn nghĩa"; t.setAttribute("aria-expanded", !p.hidden); return; }
  if (d.reveal !== undefined) { const r = document.getElementById(d.reveal); r.hidden = false; t.remove(); r.animate && !RM && r.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400 }); return; }
  if (d.pred !== undefined) { const p = SCR[st.scr].pt; st.pred[p.id] = +d.pred; save(); go(st.scr); if (+d.pred === p.predict.a) cheer($(".opt.ok")); return; }
  if (d.tok !== undefined) {
    const card = t.closest("[data-spot]"); const [pid, mi] = card.dataset.spot.split("-"); const p = PT[pid], m = p.mistakes[+mi]; const k = card.dataset.spot; const s = st.spot[k] = st.spot[k] || { tries: 0 };
    if (m.bad.includes(+d.tok)) { s.ok = true; save(); card.innerHTML = spotHTML(p, +mi); cheer($(".tok.hit", card)); }
    else { s.tries++; save(); card.innerHTML = spotHTML(p, +mi); const b = $(`[data-tok="${d.tok}"]`, card); if (b) b.classList.add("miss"); }
    return;
  }
  if (d.spotshow !== undefined) { const card = t.closest("[data-spot]"); const [pid, mi] = card.dataset.spot.split("-"); st.spot[card.dataset.spot] = { ok: true, shown: true, tries: 2 }; save(); card.innerHTML = spotHTML(PT[pid], +mi); return; }
  if (d.an) { ({ prev: () => animStep(-1), next: () => animStep(1), play: animPlay, rst: () => { if (AN) { if (AN.tm) animPlay(); AN.i = 0; animShow(); } } })[d.an](); return; }
  if (d.pair !== undefined) { pairShow(+d.pair); return; }
  if (d.tree) { const el = $("#tree"); const path = JSON.parse(el.dataset.path || "[]"); if (d.tree === "reset") treeRender(0, []); else { path.push(d.tree === "yes"); treeRender(path.length, path); } return; }
  const qb = t.closest(".quiz");
  if (qb) {
    if (d.qo !== undefined) { answer(qb, +d.qo); return; }
    if (d.qchk !== undefined) { checkGap(qb); return; }
    if (d.qj !== undefined) { st.qi[qb.dataset.key] = +d.qj; save(); renderQuiz(qb); return; }
    if (d.qre !== undefined) { const A = qState(qb.dataset.key), i = st.qi[qb.dataset.key] || 0; if (A[i]) { delete A[i].c; delete A[i].ok; } save(); renderQuiz(qb); return; }
    if (d.qwrong !== undefined) { const A = qState(qb.dataset.key); let first = -1; A.forEach((a, j) => { if (a && a.f === false) { delete a.c; delete a.ok; if (first < 0) first = j; } }); st.qi[qb.dataset.key] = Math.max(0, first); save(); renderQuiz(qb); return; }
  }
  if (d.listen !== undefined) { st.listen = !st.listen; save(); go(st.scr); return; }
  if (d.fc) {
    const list = fcList(), vi = list[FC.i];
    if (d.fc === "flip") { FC.flip = !FC.flip; $("#fcard").classList.toggle("flip", FC.flip); return; }
    if (d.fc === "all" || d.fc === "only") { FC.only = d.fc === "only"; FC.i = 0; FC.flip = false; }
    if (d.fc === "prev") { FC.i = (FC.i - 1 + list.length) % list.length; FC.flip = false; }
    if (d.fc === "next") { FC.i = (FC.i + 1) % list.length; FC.flip = false; }
    if (d.fc === "yes" || d.fc === "no") { st.known[vi] = d.fc === "yes"; save(); if (!(FC.only && d.fc === "yes")) FC.i = (FC.i + 1) % Math.max(1, list.length); FC.flip = false; }
    fcRender(); return;
  }
  if (d.print !== undefined) { window.print(); return; }
  if (d.redo !== undefined) { let target = -1; sections().forEach(x => { const A = st.ans[x.k] || []; let first = -1; A.forEach((a, j) => { if (a && a.f === false) { delete a.c; delete a.ok; if (first < 0) first = j; } }); if (first >= 0) { st.qi[x.k] = first; if (target < 0) target = x.s; } }); save(); if (target >= 0) { toast("Các câu sai đã được mở lại. Làm lại nhé!"); go(target); } return; }
  if (d.set) {
    const v = d.set;
    if (v === "scale-") st.set.scale = Math.max(.85, +(st.set.scale - .1).toFixed(2));
    else if (v === "scale+") st.set.scale = Math.min(1.45, +(st.set.scale + .1).toFixed(2));
    else if (v.startsWith("theme:")) st.set.theme = v.slice(6);
    else if (v.startsWith("rate:")) st.set.rate = +v.slice(5);
    else if (v === "reset") { if (!confirm("Xóa toàn bộ điểm và tiến độ để học lại từ đầu?")) return; const keep = { set: st.set, name: st.name }; st = Object.assign(blank(), keep); save(); $("#ovSet").hidden = true; applySet(); go(0); return; }
    save(); applySet(); openSet(); return;
  }
});
document.addEventListener("keydown", e => {
  const tg = e.target; const typing = tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.tagName === "SELECT");
  if (e.key === "Escape") { $("#ovMenu").hidden = true; $("#ovSet").hidden = true; closeSheet(); return; }
  if (typing) return;
  if ((e.key === "Enter" || e.key === " ") && tg && tg.getAttribute && tg.getAttribute("role") === "button") { e.preventDefault(); tg.click(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight") { next(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { go(st.scr - 1); e.preventDefault(); }
  else if (/^[1-4]$/.test(e.key)) { const opts = $$(".quiz .opt:not([disabled]), [data-pred]:not([disabled])", main); const b = opts[+e.key - 1]; if (b) b.click(); }
  else if (e.key === " " && AN) { e.preventDefault(); animPlay(); }
});

/* ---------- Đồng hồ (chỉ đếm khi trang đang hiển thị) ---------- */
setInterval(() => { if (document.visibilityState === "visible" && st.started) { st.time++; $("#hTime").textContent = "⏱ " + fmtT(st.time); if (st.time % 10 === 0) save(); } }, 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") { save(); stopSay(); } });
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (AN) animShow(true); else if ($("#pairTl")) pairShow(pairI, true); }, 200); });

/* ---------- Khởi động ---------- */
applySet();
$("#hTime").textContent = "⏱ " + fmtT(st.time);
go(st.scr || 0);
</script>
</body>
